<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASF Manobras — Trilha de progressão de manobras</title>
<meta name="description" content="Trilha gamificada de manobras de surf: do take-off ao aéreo, com checklist e XP. Satélite do app ASF.">
<link rel="canonical" href="https://acarolmourad-commits.github.io/asf-manobras/">
<style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f3ff;color:#2e1065}header{background:#7c3aed;color:#fff;padding:2rem;text-align:center}nav{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;padding:1rem;background:#ede9fe}nav a{color:#6d28d9;text-decoration:none;font-size:.85rem}main{max-width:640px;margin:2rem auto;padding:0 1rem}.card{background:#fff;border-radius:16px;padding:1.5rem;margin-bottom:1rem;box-shadow:0 1px 4px rgba(0,0,0,.08)}.bar{background:#ede9fe;border-radius:9999px;height:14px;overflow:hidden}.bar i{display:block;background:#7c3aed;height:100%;transition:width .4s}.mv{display:flex;align-items:center;gap:.6rem;padding:.5rem;border-bottom:1px solid #ede9fe}.mv input{width:18px;height:18px}.lvl{font-size:.7rem;background:#ede9fe;border-radius:8px;padding:2px 8px;color:#6d28d9}footer{text-align:center;padding:2rem;color:#71717a}</style>
</head>
<body>
<header><h1>ASF Manobras 🏄‍♀️⚡</h1><p>Sua trilha de progressão: do take-off ao aéreo</p></header>
<nav id="net"></nav>
<main>
<div class="card"><h2 id="xp">XP: 0</h2><div class="bar"><i id="bar" style="width:0%"></i></div><p id="rank"></p></div>
<div class="card" id="list"></div>
<div class="card"><p>💪 Combine sua trilha com os treinos do <a href="https://acarolmourad-commits.github.io/asf-treino/">ASF Treino</a>, registre cada conquista no <a href="https://acarolmourad-commits.github.io/asf-diario/">Diário</a> e suba no <a href="https://acarolmourad-commits.github.io/asf-ranking/">Ranking</a>!</p></div>
</main>
<footer>ASF Manobras — satélite do <a href="https://acarolmourad-commits.github.io/asf-app/">app ASF</a></footer>
<script>
const sites=[["asf-app","App ASF"],["asf-praias","Praias"],["asf-previsao","Previsão"],["asf-treino","Treino"],["asf-eventos","Eventos"],["asf-glossario","Glossário"],["asf-comunidade","Comunidade"],["asf-seguranca","Segurança"],["asf-equipamento","Equipamento"],["asf-quiz","Quiz"],["asf-nutricao","Nutrição"],["asf-viagens","Viagens"],["asf-bemestar","Bem-Estar"],["asf-diario","Diário"],["asf-apnea","Apneia"],["asf-carona","Carona"],["asf-ranking","Ranking"],["asf-volume","Volume"]];
document.getElementById('net').innerHTML=sites.map(s=>`<a href="https://acarolmourad-commits.github.io/${s[0]}/">${s[1]}</a>`).join('');
const MV=[["Remada eficiente","base",10],["Take-off na espuma","base",10],["Take-off na parede","base",15],["Bottom turn","base",20],["Cavada (trim)","base",20],["Cutback","inter",30],["Floater","inter",30],["Snap no lip","inter",40],["Off the lip","inter",40],["Tube ride","avanc",60],["360","avanc",80],["Aéreo","avanc",100]];
function load(){return JSON.parse(localStorage.getItem('asf-manobras')||'[]');}
function render(){const done=load();const xp=MV.filter((_,i)=>done.includes(i)).reduce((s,m)=>s+m[2],0);const total=MV.reduce((s,m)=>s+m[2],0);
document.getElementById('xp').textContent='XP: '+xp;document.getElementById('bar').style.width=(100*xp/total)+'%';
document.getElementById('rank').textContent=xp<50?'🌱 Iniciante':xp<200?'🌊 Progressando':xp<400?'🔥 Intermediária':'👑 Avançada';
document.getElementById('list').innerHTML=MV.map((m,i)=>`<label class="mv"><input type="checkbox" ${done.includes(i)?'checked':''} onchange="t(${i})"><b>${m[0]}</b><span class="lvl">${m[1]}</span><span style="margin-left:auto">+${m[2]} XP</span></label>`).join('');}
function t(i){let d=load();d=d.includes(i)?d.filter(x=>x!==i):[...d,i];localStorage.setItem('asf-manobras',JSON.stringify(d));render();}
render();
</script>
</body>
</html>
